        // Decodificación UTF-8 segura de Base64
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        const markdown = new TextDecoder("utf-8").decode(bytes);

        mermaid.initialize({
          startOnLoad: false,
          theme: "default",
          securityLevel: "loose"
        });

        marked.setOptions({
          gfm: true,
          breaks: false
        });

        const container = document.getElementById("doc-render");
        container.innerHTML = marked.parse(markdown);

        // Convertir bloques de código mermaid
        const codeBlocks = container.querySelectorAll("pre code.language-mermaid");
        codeBlocks.forEach(code => {
          const pre = code.parentElement;
          const div = document.createElement("div");
          div.className = "mermaid";
          div.textContent = code.textContent;
          pre.replaceWith(div);
        });

        await mermaid.run();
        document.body.classList.add("doc-ready");
      } catch (err) {
        console.error("Error al renderizar:", err);
        document.getElementById("doc-render").innerHTML = "<div style='color:red; padding:20px;'>Error procesando la documentación: " + err.message + "</div>";
      }
    })();
