<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tienda Demo</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mu:#667085;--bd:#e4e7ec;--ac:#4f46e5;--ac2:#eef2ff;--ok:#12b76a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--card:#171a1f;--tx:#eceef2;--mu:#98a2b3;--bd:#2a2f37;--ac:#818cf8;--ac2:#1f2240}}
:root[data-theme="dark"]{--bg:#0e1013;--card:#171a1f;--tx:#eceef2;--mu:#98a2b3;--bd:#2a2f37;--ac:#818cf8;--ac2:#1f2240}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd)}
.bar{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px;color:var(--ac)}
nav{display:flex;gap:4px;flex:1;overflow-x:auto}
nav button{background:none;border:0;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac2);color:var(--ac)}
main{max-width:1100px;margin:auto;padding:18px 16px 60px}
h2{margin:0 0 14px;font-size:20px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;width:100%}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--ac2);color:var(--ac)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.pic{height:110px;border-radius:10px;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:56px}
.mu{color:var(--mu);font-size:13px}.price{font-weight:800;font-size:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.line{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.line:last-child{border:0}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:3px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu)}
pre{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;overflow-x:auto;font-size:12px;max-height:420px}
.badge{background:var(--ac);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:4px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.ok{color:var(--ok);font-weight:700}
</style>
</head>
<body>
<header><div class="bar">
  <span class="logo">🛍️ Tienda Demo</span>
  <nav id="nav"></nav>
</div></header>
<main id="app"></main>
<div id="toast"></div>

<script>
const KEY='ecom_demo_v1';
const SEED=()=>({
 categoria:[
  {id_categoria:'CAT01',nombre_categoria:'Tecnología'},
  {id_categoria:'CAT02',nombre_categoria:'Hogar'},
  {id_categoria:'CAT03',nombre_categoria:'Deportes'},
  {id_categoria:'CAT04',nombre_categoria:'Libros'}],
 producto:[
  ['P001','Auriculares Bluetooth',59.9,'CAT01','🎧'],['P002','Teclado mecánico',89.5,'CAT01','⌨️'],
  ['P003','Smartwatch',129,'CAT01','⌚'],['P004','Lámpara de escritorio',34.99,'CAT02','💡'],
  ['P005','Cafetera italiana',27.5,'CAT02','☕'],['P006','Set de sartenes',74,'CAT02','🍳'],
  ['P007','Balón de fútbol',22,'CAT03','⚽'],['P008','Mat de yoga',31.25,'CAT03','🧘'],
  ['P009','Zapatillas running',98,'CAT03','👟'],['P010','Novela de misterio',14.9,'CAT04','📕'],
  ['P011','Guía de programación',42,'CAT04','📘'],['P012','Atlas del mundo',36.5,'CAT04','🌍']
 ].map(p=>({id_producto:p[0],nombre_producto:p[1],precio_actual:p[2],id_categoria:p[3],_e:p[4]})),
 cliente:[
  {id_cliente:'C001',nom1_cliente:'María',nom2_cliente:'José',ape1_cliente:'Pérez',ape2_cliente:'Rojas'},
  {id_cliente:'C002',nom1_cliente:'Carlos',nom2_cliente:'',ape1_cliente:'Gómez',ape2_cliente:'Díaz'},
  {id_cliente:'C003',nom1_cliente:'Lucía',nom2_cliente:'Andrea',ape1_cliente:'Soto',ape2_cliente:'Vega'}],
 cliente_telefono:[
  {id_telefono:'T001',id_cliente:'C001',numero_telefono:'+56 9 1234 5678'},
  {id_telefono:'T002',id_cliente:'C001',numero_telefono:'+56 2 2345 6789'},
  {id_telefono:'T003',id_cliente:'C002',numero_telefono:'+56 9 8765 4321'},
  {id_telefono:'T004',id_cliente:'C003',numero_telefono:'+56 9 5555 0101'}],
 orden:[{id_orden:'O001',id_cliente:'C001'},{id_orden:'O002',id_cliente:'C002'},{id_orden:'O003',id_cliente:'C003'}],
 orden_detalle:[
  {id_orden:'O001',id_producto:'P001',cantidad:1},{id_orden:'O001',id_producto:'P010',cantidad:2},
  {id_orden:'O002',id_producto:'P007',cantidad:3},{id_orden:'O002',id_producto:'P008',cantidad:1},
  {id_orden:'O003',id_producto:'P003',cantidad:1},{id_orden:'O003',id_producto:'P005',cantidad:2},{id_orden:'O003',id_producto:'P012',cantidad:1}]
});
let db,cart={},view='tienda',cat='ALL',q='',last=null;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.producto)db=SEED();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const $=s=>document.querySelector(s);
const money=n=>'$'+Number(n).toFixed(2);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const prod=id=>db.producto.find(p=>p.id_producto===id);
const cli=id=>db.cliente.find(c=>c.id_cliente===id);
const nom=c=>c?[c.nom1_cliente,c.nom2_cliente,c.ape1_cliente,c.ape2_cliente].filter(Boolean).join(' '):'—';
const cartCount=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const cartTotal=()=>Object.entries(cart).reduce((a,[id,n])=>a+prod(id).precio_actual*n,0);
const nextId=(arr,k,pre)=>pre+String(Math.max(0,...arr.map(x=>+x[k].slice(pre.length)||0))+1).padStart(3,'0');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function go(v){view=v;render()}
function add(id){cart[id]=(cart[id]||0)+1;toast('Agregado al carrito');renderNav()}
function setQty(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];render()}

function renderNav(){
 const t=[['tienda','Tienda'],['carrito','Carrito'],['ordenes','Órdenes'],['bd','Base de datos']];
 $('#nav').innerHTML=t.map(([k,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}')">${l}${k==='carrito'&&cartCount()?`<span class="badge">${cartCount()}</span>`:''}</button>`).join('');
}
function vTienda(){
 const list=db.producto.filter(p=>(cat==='ALL'||p.id_categoria===cat)&&p.nombre_producto.toLowerCase().includes(q.toLowerCase()));
 return `<h2>Catálogo</h2>
 <input id="q" placeholder="Buscar productos…" value="${esc(q)}" oninput="q=this.value;keep()">
 <div class="chips"><button class="chip ${cat==='ALL'?'on':''}" onclick="cat='ALL';render()">Todas</button>
 ${db.categoria.map(c=>`<button class="chip ${cat===c.id_categoria?'on':''}" onclick="cat='${c.id_categoria}';render()">${esc(c.nombre_categoria)}</button>`).join('')}</div>
 <div class="grid">${list.map(p=>`<div class="card"><div class="pic">${p._e||'📦'}</div>
 <div class="mu">${esc(db.categoria.find(c=>c.id_categoria===p.id_categoria)?.nombre_categoria||'')}</div>
 <b>${esc(p.nombre_producto)}</b><div class="row"><span class="price">${money(p.precio_actual)}</span>
 <button class="btn" onclick="add('${p.id_producto}')">Agregar</button></div></div>`).join('')||'<p class="mu">Sin resultados.</p>'}</div>`;
}
function keep(){const pos=$('#q').selectionStart;render();const i=$('#q');i.focus();i.setSelectionRange(pos,pos)}
function vCarrito(){
 if(last)return `<div class="panel"><h2 class="ok">✔ Orden ${last} creada</h2><p>Se guardó en las tablas <code>orden</code> y <code>orden_detalle</code>.</p>
 <button class="btn" onclick="last=null;go('ordenes')">Ver órdenes</button> <button class="btn sec" onclick="last=null;go('tienda')">Seguir comprando</button></div>`;
 const ids=Object.keys(cart);
 if(!ids.length)return `<h2>Carrito</h2><div class="panel mu">Tu carrito está vacío.</div><button class="btn" onclick="go('tienda')">Ir a la tienda</button>`;
 return `<h2>Carrito</h2><div class="panel">${ids.map(id=>{const p=prod(id);return `<div class="line"><span style="font-size:28px">${p._e||'📦'}</span>
 <div style="flex:1"><b>${esc(p.nombre_producto)}</b><div class="mu">${money(p.precio_actual)} c/u</div></div>
 <div class="qty"><button onclick="setQty('${id}',-1)">−</button>${cart[id]}<button onclick="setQty('${id}',1)">+</button></div>
 <b style="width:80px;text-align:right">${money(p.precio_actual*cart[id])}</b></div>`}).join('')}
 <div class="row" style="margin-top:10px"><span>Total</span><span class="price">${money(cartTotal())}</span></div></div>
 <div class="panel"><h2 style="font-size:17px">Datos del cliente</h2>
 <label>Cliente</label><select id="cs" onchange="render2()"><option value="NEW">➕ Nuevo cliente</option>${db.cliente.map(c=>`<option value="${c.id_cliente}">${esc(nom(c))}</option>`).join('')}</select>
 <div class="form" id="nf">
  <div><label>Primer nombre *</label><input id="n1"></div><div><label>Segundo nombre</label><input id="n2"></div>
  <div><label>Primer apellido *</label><input id="a1"></div><div><label>Segundo apellido</label><input id="a2"></div>
  <div><label>Teléfono *</label><input id="tel" type="tel"></div></div>
 <button class="btn" onclick="checkout()">Confirmar compra</button></div>`;
}
function render2(){$('#nf').style.display=$('#cs').value==='NEW'?'grid':'none'}
function checkout(){
 let idc=$('#cs').value;
 if(idc==='NEW'){
  const n1=$('#n1').value.trim(),a1=$('#a1').value.trim(),tel=$('#tel').value.trim();
  if(!n1||!a1||!tel)return toast('Completa los campos obligatorios');
  idc=nextId(db.cliente,'id_cliente','C');
  db.cliente.push({id_cliente:idc,nom1_cliente:n1,nom2_cliente:$('#n2').value.trim(),ape1_cliente:a1,ape2_cliente:$('#a2').value.trim()});
  db.cliente_telefono.push({id_telefono:nextId(db.cliente_telefono,'id_telefono','T'),id_cliente:idc,numero_telefono:tel});
 }
 const ido=nextId(db.orden,'id_orden','O');
 db.orden.push({id_orden:ido,id_cliente:idc});
 Object.entries(cart).forEach(([id,n])=>db.orden_detalle.push({id_orden:ido,id_producto:id,cantidad:n}));
 cart={};last=ido;save();render();
}
function vOrdenes(){
 const tot=o=>db.orden_detalle.filter(d=>d.id_orden===o).reduce((a,d)=>a+prod(d.id_producto).precio_actual*d.cantidad,0);
 return `<h2>Órdenes</h2>`+[...db.orden].reverse().map(o=>{const c=cli(o.id_cliente);
 const tels=db.cliente_telefono.filter(t=>t.id_cliente===o.id_cliente).map(t=>t.numero_telefono).join(' · ');
 return `<div class="panel"><div class="row"><b>${o.id_orden}</b><span class="price">${money(tot(o.id_orden))}</span></div>
 <div class="mu">${esc(nom(c))} · ${esc(tels)}</div>
 ${db.orden_detalle.filter(d=>d.id_orden===o.id_orden).map(d=>{const p=prod(d.id_producto);return `<div class="line"><span>${p._e||''}</span><span style="flex:1">${esc(p.nombre_producto)}</span><span class="mu">${d.cantidad} × ${money(p.precio_actual)}</span><b>${money(d.cantidad*p.precio_actual)}</b></div>`}).join('')}</div>`}).join('');
}
const DDL=`CREATE TABLE categoria (
  id_categoria TEXT PRIMARY KEY,
  nombre_categoria TEXT NOT NULL
);
CREATE TABLE producto (
  id_producto TEXT PRIMARY KEY,
  nombre_producto TEXT NOT NULL,
  precio_actual NUMERIC NOT NULL,
  id_categoria TEXT REFERENCES categoria(id_categoria)
);
CREATE TABLE cliente (
  id_cliente TEXT PRIMARY KEY,
  nom1_cliente TEXT NOT NULL,
  nom2_cliente TEXT,
  ape1_cliente TEXT NOT NULL,
  ape2_cliente TEXT
);
CREATE TABLE cliente_telefono (
  id_telefono TEXT PRIMARY KEY,
  id_cliente TEXT REFERENCES cliente(id_cliente),
  numero_telefono TEXT NOT NULL
);
CREATE TABLE orden (
  id_orden TEXT PRIMARY KEY,
  id_cliente TEXT REFERENCES cliente(id_cliente)
);
CREATE TABLE orden_detalle (
  id_orden TEXT REFERENCES orden(id_orden),
  id_producto TEXT REFERENCES producto(id_producto),
  cantidad INT4 NOT NULL,
  PRIMARY KEY (id_orden, id_producto)
);
`;
function sql(){
 const v=x=>typeof x==='number'?x:"'"+String(x).replace(/'/g,"''")+"'";
 let s=DDL+'\n';
 ['categoria','producto','cliente','cliente_telefono','orden','orden_detalle'].forEach(t=>{
  db[t].forEach(r=>{const k=Object.keys(r).filter(k=>k[0]!=='_');s+=`INSERT INTO ${t} (${k.join(', ')}) VALUES (${k.map(c=>v(r[c])).join(', ')});\n`});s+='\n'});
 return s;
}
function vBd(){
 return `<h2>Base de datos</h2><div class="row" style="justify-content:flex-start;margin-bottom:14px">
 <button class="btn" onclick="copySql()">Copiar SQL</button><button class="btn sec" onclick="if(confirm('¿Restaurar datos de ejemplo?')){db=SEED();cart={};save();render()}">Restaurar ejemplo</button></div>`+
 ['categoria','producto','cliente','cliente_telefono','orden','orden_detalle'].map(t=>{const k=Object.keys(db[t][0]||{}).filter(k=>k[0]!=='_');
 return `<div class="panel"><b>${t}</b> <span class="mu">(${db[t].length} filas)</span><div class="scroll"><table><tr>${k.map(c=>`<th>${c}</th>`).join('')}</tr>
 ${db[t].map(r=>`<tr>${k.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</table></div></div>`}).join('')+
 `<h2>Script SQL (PostgreSQL)</h2><pre id="sql">${esc(sql())}</pre>`;
}
function copySql(){try{navigator.clipboard.writeText(sql());toast('SQL copiado')}catch(e){const r=document.createRange();r.selectNode($('#sql'));getSelection().removeAllRanges();getSelection().addRange(r)}}
function render(){
 renderNav();
 $('#app').innerHTML={tienda:vTienda,carrito:vCarrito,ordenes:vOrdenes,bd:vBd}[view]();
 if(view==='carrito'&&!last&&Object.keys(cart).length)render2();
}
render();
</script>
</body>
</html>
